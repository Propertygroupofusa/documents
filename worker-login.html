<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGUSA Worker Portal - Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: #f8f9ff;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid #c33;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid #3c3;
        }

        .success-message.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-size: 14px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 13px;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s;
        }

        .links a:hover {
            color: #764ba2;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            color: #999;
            font-size: 13px;
        }

        .signup-prompt {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .signup-prompt a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-prompt a:hover {
            text-decoration: underline;
        }

        .info-banner {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #333;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .toggle-link {
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .toggle-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>PGUSA</h1>
            <p>Worker Portal</p>
        </div>

        <div class="info-banner">
            🎉 First month PRO free + $50 bonus after 5 jobs
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div id="loginView" class="view active">
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="your@email.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    Sign In
                </button>

                <div class="loading" id="loading">
                    <span class="spinner"></span>
                    Signing in...
                </div>
            </form>

            <div class="links">
                <a href="mailto:propertygroupofusa@gmail.com?subject=Password%20Reset%20Request">Forgot password?</a>
                <a href="mailto:propertygroupofusa@gmail.com?subject=Worker%20Portal%20Help">Need help?</a>
            </div>

            <div class="divider">or</div>

            <div class="signup-prompt">
                Don't have an account?
                <button type="button" class="toggle-link" onclick="showView('signup')">Apply to become a worker</button>
            </div>
        </div>

        <div id="signupView" class="view">
            <form id="signupForm" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input
                        type="text"
                        id="signupName"
                        placeholder="Jane Smith"
                        required
                        autocomplete="name"
                    >
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="your@email.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="signupPhone">Phone Number</label>
                    <input
                        type="tel"
                        id="signupPhone"
                        placeholder="(210) 555-0100"
                        required
                        autocomplete="tel"
                    >
                </div>

                <div class="form-group">
                    <label for="signupPassword">Create a Password</label>
                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="••••••••"
                        required
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" class="btn-login" id="signupBtn">
                    Apply Now
                </button>

                <div class="loading" id="signupLoading">
                    <span class="spinner"></span>
                    Submitting your application...
                </div>
            </form>

            <div class="signup-prompt">
                Already have an account?
                <button type="button" class="toggle-link" onclick="showView('login')">Sign in</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://pgusa-platform-production.up.railway.app';

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');
            const loadingEl = document.getElementById('loading');
            const loginBtn = document.getElementById('loginBtn');

            // Clear messages
            errorEl.classList.remove('show');
            successEl.classList.remove('show');

            // Validate
            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }

            // Show loading
            loadingEl.classList.add('show');
            loginBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        username: email,
                        password: password,
                        grant_type: 'password'
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    const errorMsg = data.detail || 'Login failed. Please try again.';
                    throw new Error(errorMsg);
                }

                // Success
                showSuccess(`Welcome back, ${data.name}! Redirecting...`);
                
                // Store token
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('user_id', data.user_id);
                localStorage.setItem('user_name', data.name);
                localStorage.setItem('user_type', data.user_type);

                // Redirect after 1.5 seconds
                setTimeout(() => {
                    window.location.href = '/documents/dashboard.html';
                }, 1500);

            } catch (error) {
                showError(error.message || 'An error occurred. Please try again.');
            } finally {
                loadingEl.classList.remove('show');
                loginBtn.disabled = false;
            }
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = '❌ ' + message;
            errorEl.classList.add('show');
        }

        function showSuccess(message) {
            const successEl = document.getElementById('successMessage');
            successEl.textContent = '✅ ' + message;
            successEl.classList.add('show');
        }

        function showView(view) {
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
            document.getElementById('loginView').classList.toggle('active', view === 'login');
            document.getElementById('signupView').classList.toggle('active', view === 'signup');
        }

        async function handleSignup(event) {
            event.preventDefault();

            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const phone = document.getElementById('signupPhone').value.trim();
            const password = document.getElementById('signupPassword').value;

            const loadingEl = document.getElementById('signupLoading');
            const signupBtn = document.getElementById('signupBtn');

            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');

            if (!name || !email || !phone || !password) {
                showError('Please fill in every field.');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }

            loadingEl.classList.add('show');
            signupBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        phone: phone,
                        password: password,
                        user_type: 'worker'
                    })
                });

                if (!response.ok) {
                    let errorMsg = 'Could not submit your application automatically.';
                    try {
                        const data = await response.json();
                        errorMsg = data.detail || errorMsg;
                    } catch (e) { /* response wasn't JSON */ }
                    throw new Error(errorMsg);
                }

                showSuccess(`Thanks, ${name}! Your application was submitted. Check ${email} for next steps.`);
                document.getElementById('signupForm').reset();

            } catch (error) {
                // Fall back to email so no application is ever lost, even if the
                // signup endpoint is down or unreachable.
                showError((error.message || 'Something went wrong') + ' We’ve opened an email with your details — just hit send.');
                const body = `Name: ${name}\nEmail: ${email}\nPhone: ${phone}`;
                window.location.href = `mailto:propertygroupofusa@gmail.com?subject=${encodeURIComponent('Worker Application')}&body=${encodeURIComponent(body)}`;
            } finally {
                loadingEl.classList.remove('show');
                signupBtn.disabled = false;
            }
        }

        // Check if already logged in
        window.addEventListener('load', () => {
            const token = localStorage.getItem('token');
            if (token) {
                // Already logged in, redirect to dashboard
                window.location.href = '/documents/dashboard.html';
            }
        });
    </script>
</body>
</html>
