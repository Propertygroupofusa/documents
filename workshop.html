<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PGUSA Empire — Real Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #060B14;
    color: #fff;
    min-height: 100vh;
    padding: 20px;
  }
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box { background: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 32px; max-width: 380px; width: 100%; }
  .login-box input {
    width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #30363d;
    background: #0d1117; color: #fff; font-size: 14px;
  }
  .login-box button {
    width: 100%; padding: 12px; border-radius: 8px; border: none; background: #F59E0B;
    color: #000; font-weight: 800; font-size: 14px; cursor: pointer;
  }
  .error-text { color: #f87171; font-size: 12px; margin-bottom: 10px; }

  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .header h1 { font-size: 20px; font-weight: 900; }
  .header h1 span { color: #F59E0B; }
  .status-row { display: flex; align-items: center; gap: 14px; font-size: 12px; color: #64748B; }
  .last-updated { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #34D399; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .logout-btn { background: none; border: none; color: #64748B; text-decoration: underline; font-size: 12px; cursor: pointer; }

  .stats-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; text-align: center; }
  .stat-num { font-size: 24px; font-weight: 900; color: #F59E0B; }
  .stat-num.green { color: #34D399; }
  .stat-num.blue { color: #60A5FA; }
  .stat-label { font-size: 10px; color: #64748B; margin-top: 4px; text-transform: uppercase; }

  .panel { background: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .panel-title { font-size: 12px; font-weight: 700; color: #F59E0B; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .row-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
  .row-item:last-child { border-bottom: none; }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
  .badge.complete { background: rgba(52,211,153,0.15); color: #34D399; }
  .badge.running { background: rgba(96,165,250,0.15); color: #60A5FA; }
  .badge.queued { background: rgba(245,158,11,0.15); color: #F59E0B; }
  .badge.error { background: rgba(248,113,113,0.15); color: #f87171; }
  .empty { color: #475569; font-size: 12px; text-align: center; padding: 20px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
var API_BASE = 'https://pgusa-platform-production.up.railway.app';
var REFRESH_MS = 60000; // real poll every 60s — not a fake animation timer

var state = {
  token: localStorage.getItem('pgusa_admin_token') || null,
  loginEmail: '',
  loginError: null,
  loginLoading: false,
  dashboard: null,
  campaigns: [],
  workers: [],
  lastUpdated: null,
  error: null
};

function esc(str) {
  var d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

function formatApiError(detail, fallback) {
  if (!detail) return fallback || 'Something went wrong';
  if (typeof detail === 'string') return detail;
  if (Array.isArray(detail)) return detail.map(function(i){ return (i && i.msg) || JSON.stringify(i); }).join(' ');
  return JSON.stringify(detail);
}

function render() {
  var root = document.getElementById('root');
  if (!state.token) {
    root.innerHTML = renderLogin();
    attachLoginHandlers();
    return;
  }
  root.innerHTML = renderDashboard();
  var logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) logoutBtn.onclick = function() {
    state.token = null;
    localStorage.removeItem('pgusa_admin_token');
    render();
  };
}

function renderLogin() {
  var errorHtml = state.loginError ? ('<div class="error-text">' + esc(state.loginError) + '</div>') : '';
  return (
    '<div class="login-wrap"><div class="login-box">' +
      '<h2 style="margin-bottom:6px;">PGUSA Empire</h2>' +
      '<p style="font-size:13px;color:#64748B;margin-bottom:18px;">Admin login — real data only.</p>' +
      '<form id="loginForm">' +
        '<input type="email" id="adminEmail" placeholder="Admin email" required />' +
        '<input type="password" id="adminPassword" placeholder="Password" required />' +
        errorHtml +
        '<button type="submit" ' + (state.loginLoading ? 'disabled' : '') + '>' + (state.loginLoading ? 'Logging in...' : 'Log In') + '</button>' +
      '</form>' +
    '</div></div>'
  );
}

function attachLoginHandlers() {
  document.getElementById('loginForm').onsubmit = function(e) {
    e.preventDefault();
    state.loginError = null;
    state.loginLoading = true;
    render();

    var email = document.getElementById('adminEmail').value;
    var password = document.getElementById('adminPassword').value;
    var body = new URLSearchParams();
    body.append('username', email);
    body.append('password', password);

    fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body
    })
      .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
      .then(function(result) {
        if (!result.ok) throw new Error(formatApiError(result.data.detail, 'Login failed'));
        if (result.data.user_type !== 'admin') throw new Error('This account is not an admin account.');
        state.token = result.data.access_token;
        localStorage.setItem('pgusa_admin_token', state.token);
        loadAll();
      })
      .catch(function(err) {
        state.loginError = err.message;
        state.loginLoading = false;
        render();
      });
  };
}

function renderDashboard() {
  var d = state.dashboard;
  var statsHtml = '';
  if (d) {
    statsHtml =
      '<div class="stats-row">' +
        statCard(d.total_workers, 'Total Workers', 'gold') +
        statCard(d.approved_workers, 'Approved Workers', 'green') +
        statCard(d.pending_workers, 'Pending Approval', 'blue') +
        statCard(d.total_clients, 'Total Clients', 'gold') +
        statCard(d.total_jobs, 'Total Jobs', 'green') +
        statCard(d.active_jobs, 'Active Jobs', 'blue') +
        statCard(d.completed_jobs, 'Completed Jobs', 'gold') +
        statCard('$' + Number(d.total_revenue).toFixed(2), 'Total Revenue', 'green') +
        statCard('$' + Number(d.this_month_revenue).toFixed(2), 'This Month', 'blue') +
        statCard('$' + Number(d.platform_volume_24h).toFixed(2), '24h Volume', 'gold') +
        statCard('$' + Number(d.avg_job_value).toFixed(2), 'Avg Job Value', 'green') +
        statCard(d.system_health, 'System Health', 'blue') +
      '</div>';
  } else if (state.error) {
    statsHtml = '<div class="panel"><div class="empty" style="color:#f87171;">' + esc(state.error) + '</div></div>';
  } else {
    statsHtml = '<div class="panel"><div class="empty">Loading real stats...</div></div>';
  }

  var campaignsHtml = state.campaigns.length === 0
    ? '<div class="empty">No campaigns yet.</div>'
    : state.campaigns.slice(0, 10).map(function(c) {
        var badgeClass = c.status === 'complete' ? 'complete' : c.status === 'running' ? 'running' : c.status === 'error' ? 'error' : 'queued';
        return (
          '<div class="row-item">' +
            '<span>' + esc(c.name) + '</span>' +
            '<span>' + c.sent + '/' + c.total + ' sent</span>' +
            '<span class="badge ' + badgeClass + '">' + esc(c.status).toUpperCase() + '</span>' +
          '</div>'
        );
      }).join('');

  var workersHtml = state.workers.length === 0
    ? '<div class="empty">No approved workers yet.</div>'
    : state.workers.slice(0, 10).map(function(w) {
        return (
          '<div class="row-item">' +
            '<span>' + esc(w.name) + '</span>' +
            '<span>' + esc(w.title) + '</span>' +
            '<span>' + w.jobs + ' jobs &middot; ' + Number(w.rating).toFixed(1) + '&#9733;</span>' +
          '</div>'
        );
      }).join('');

  return (
    '<div class="header">' +
      '<h1>PGUSA <span>Empire</span> — Real Dashboard</h1>' +
      '<div class="status-row">' +
        '<div class="last-updated"><div class="dot"></div>' + (state.lastUpdated ? ('Updated ' + state.lastUpdated) : 'Loading...') + '</div>' +
        '<button class="logout-btn" id="logoutBtn">Log out</button>' +
      '</div>' +
    '</div>' +
    statsHtml +
    '<div class="panel"><div class="panel-title">📧 Real Campaigns</div>' + campaignsHtml + '</div>' +
    '<div class="panel"><div class="panel-title">👷 Real Approved Workers</div>' + workersHtml + '</div>'
  );
}

function statCard(value, label, color) {
  return (
    '<div class="stat-card">' +
      '<div class="stat-num ' + color + '">' + esc(value) + '</div>' +
      '<div class="stat-label">' + esc(label) + '</div>' +
    '</div>'
  );
}

function loadAll() {
  state.error = null;
  var headers = { 'Authorization': 'Bearer ' + state.token };

  var dashboardP = fetch(API_BASE + '/admin/dashboard', { headers: headers })
    .then(function(res) {
      if (res.status === 401) { state.token = null; localStorage.removeItem('pgusa_admin_token'); throw new Error('Session expired'); }
      return res.json();
    })
    .then(function(data) { state.dashboard = data; })
    .catch(function(err) { state.error = err.message; });

  var campaignsP = fetch(API_BASE + '/outreach/campaigns')
    .then(function(res) { return res.json(); })
    .then(function(data) { state.campaigns = Array.isArray(data) ? data : []; })
    .catch(function() { state.campaigns = []; });

  var workersP = fetch(API_BASE + '/workers/browse?limit=20')
    .then(function(res) { return res.json(); })
    .then(function(data) { state.workers = data.workers || []; })
    .catch(function() { state.workers = []; });

  Promise.all([dashboardP, campaignsP, workersP]).then(function() {
    state.lastUpdated = new Date().toLocaleTimeString();
    state.loginLoading = false;
    render();
  });
}

// Real polling — actual fetches on a real interval, not a fake counter.
if (state.token) {
  loadAll();
  setInterval(function() { if (state.token) loadAll(); }, REFRESH_MS);
} else {
  render();
}
</script>
</body>
</html>
