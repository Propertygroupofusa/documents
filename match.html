<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WorkMatch — Find & Book PGUSA Workers</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #eff6ff, #ecfdf5);
    min-height: 100vh;
    color: #0f172a;
  }
  .app-header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,0.95);
    border-bottom: 1px solid #e2e8f0;
    padding: 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .logo { font-size: 22px; font-weight: 800; background: linear-gradient(90deg,#2563eb,#059669); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tabs { display: flex; gap: 24px; padding: 0 16px; background: rgba(255,255,255,0.95); border-bottom: 1px solid #e2e8f0; }
  .tab { padding: 12px 4px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #64748b; border: none; background: none; border-bottom: 2px solid transparent; cursor: pointer; }
  .tab.active { color: #2563eb; border-color: #2563eb; }
  .container { max-width: 640px; margin: 0 auto; padding: 16px; }

  .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); overflow: hidden; margin-bottom: 16px; }
  .card-banner { height: 100px; background: linear-gradient(90deg,#3b82f6,#10b981,#14b8a6); position: relative; }
  .avatar { position: absolute; bottom: -40px; left: 50%; transform: translateX(-50%); width: 90px; height: 90px; border-radius: 50%; background: #e2e8f0; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 42px; }
  .card-body { padding: 56px 20px 20px; text-align: center; }
  .worker-name { font-size: 22px; font-weight: 800; }
  .worker-title { color: #059669; font-weight: 600; margin-top: 2px; }
  .stat-row { display: flex; justify-content: space-around; padding: 16px 0; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; margin: 16px 0; }
  .stat-num { font-size: 22px; font-weight: 800; }
  .stat-label { font-size: 11px; color: #64748b; }
  .loc-row { font-size: 14px; color: #334155; margin-bottom: 12px; }
  .skill { display: inline-block; background: #dbeafe; color: #1d4ed8; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; margin: 3px; }

  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { padding: 14px; border-radius: 12px; font-weight: 800; font-size: 14px; border: none; cursor: pointer; }
  .btn-skip { background: #f1f5f9; color: #334155; }
  .btn-book { background: linear-gradient(90deg,#10b981,#0d9488); color: #fff; }
  .btn-primary { background: #2563eb; color: #fff; width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 800; font-size: 14px; cursor: pointer; }
  .btn-secondary { background: #f1f5f9; color: #334155; }

  input, select, textarea {
    width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; margin-bottom: 12px;
  }
  label.checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #475569; margin-bottom: 12px; }
  label.checkbox input { width: auto; margin: 0; }

  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login-box { background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 32px; max-width: 380px; width: 100%; }
  .toggle-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .toggle-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 700; font-size: 13px; cursor: pointer; background: #f1f5f9; color: #475569; }
  .toggle-btn.active { background: #2563eb; color: #fff; }
  .error-text { color: #dc2626; font-size: 12px; margin-bottom: 10px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 30; padding: 16px; }
  .modal-box { background: #fff; border-radius: 16px; padding: 24px; max-width: 420px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .result-line { font-size: 14px; margin-bottom: 4px; }
  .empty-state { text-align: center; padding: 60px 20px; color: #64748b; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .logout-link { font-size: 12px; color: #64748b; text-decoration: underline; background: none; border: none; cursor: pointer; }
</style>
</head>
<body>
<div id="root"></div>

<script>
var API_BASE = 'https://pgusa-platform-production.up.railway.app';

function getResetTokenFromUrl() {
  var params = new URLSearchParams(window.location.search);
  return params.get('reset_token');
}

var state = {
  authMode: getResetTokenFromUrl() ? 'reset' : 'login', // login | register | forgot | reset
  resetToken: getResetTokenFromUrl(),
  token: localStorage.getItem('pgusa_client_token') || null,
  clientName: localStorage.getItem('pgusa_client_name') || null,
  activeTab: 'discover',
  cardIndex: 0,
  workers: [],
  matches: [],
  loading: true,
  error: null,
  authError: null,
  authLoading: false,
  forgotSent: false,
  resetDone: false,
  formValues: { firstName: '', lastName: '', phone: '', state: '', email: '', forgotEmail: '' },
  bookingWorker: null,
  pricingOptions: [],
  pricingLoading: false,
  bookingSubmitting: false,
  bookingError: null,
  bookingResult: null
};

var AVATAR_EMOJIS = ['\u{1F9D1}\u200D\u{1F4BC}', '\u{1F469}\u200D\u{1F4BC}', '\u{1F468}\u200D\u{1F4BC}', '\u{1F469}\u200D\u{1F4BB}', '\u{1F468}\u200D\u2696\uFE0F', '\u{1F469}\u200D\u{1F527}', '\u{1F468}\u200D\u{1F527}'];
function avatarFor(id) {
  var hash = 0;
  var s = String(id);
  for (var i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
  return AVATAR_EMOJIS[hash % AVATAR_EMOJIS.length];
}
function esc(str) {
  var d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

function formatApiError(detail, fallback) {
  if (!detail) return fallback || 'Something went wrong';
  if (typeof detail === 'string') return detail;
  if (Array.isArray(detail)) {
    var msgs = detail.map(function(item) {
      if (item && typeof item === 'object') return item.msg || JSON.stringify(item);
      return String(item);
    });
    return msgs.join(' ');
  }
  if (typeof detail === 'object') return detail.msg || JSON.stringify(detail);
  return String(detail);
}

function render() {
  var root = document.getElementById('root');
  if (!state.token) {
    root.innerHTML = renderLogin();
    attachLoginHandlers();
    return;
  }
  root.innerHTML = renderApp();
  attachAppHandlers();
}

function renderLogin() {
  if (state.authMode === 'forgot') return renderForgotForm();
  if (state.authMode === 'reset') return renderResetForm();

  var isLogin = state.authMode === 'login';
  var extraFields = '';
  if (!isLogin) {
    extraFields =
      '<div class="two-col">' +
        '<input type="text" id="regFirstName" placeholder="First name" value="' + esc(state.formValues.firstName) + '" required />' +
        '<input type="text" id="regLastName" placeholder="Last name" value="' + esc(state.formValues.lastName) + '" required />' +
      '</div>' +
      '<input type="tel" id="regPhone" placeholder="Phone" value="' + esc(state.formValues.phone) + '" required />' +
      '<input type="text" id="regState" placeholder="State (e.g. TX)" value="' + esc(state.formValues.state) + '" maxlength="2" required />';
  }
  var errorHtml = state.authError ? ('<div class="error-text">' + esc(state.authError) + '</div>') : '';
  var forgotLink = isLogin ? '<p style="text-align:center;margin-top:10px;"><button type="button" id="forgotLink" style="background:none;border:none;color:#2563eb;font-size:12px;cursor:pointer;text-decoration:underline;">Forgot password?</button></p>' : '';
  return (
    '<div class="login-wrap"><div class="login-box">' +
      '<div style="text-align:center;margin-bottom:20px;">' +
        '<div class="logo">WorkMatch</div>' +
        '<p style="font-size:13px;color:#64748b;margin-top:6px;">' + (isLogin ? 'Log in to book real workers.' : 'Create a client account to get started.') + '</p>' +
      '</div>' +
      '<div class="toggle-row">' +
        '<button class="toggle-btn ' + (isLogin ? 'active' : '') + '" id="modeLogin">Log In</button>' +
        '<button class="toggle-btn ' + (!isLogin ? 'active' : '') + '" id="modeRegister">Register</button>' +
      '</div>' +
      '<form id="authForm">' +
        extraFields +
        '<input type="email" id="loginEmail" placeholder="Email" value="' + esc(state.formValues.email) + '" required />' +
        '<input type="password" id="loginPassword" placeholder="Password" required />' +
        errorHtml +
        '<button type="submit" class="btn-primary" ' + (state.authLoading ? 'disabled' : '') + '>' + (state.authLoading ? 'Please wait...' : (isLogin ? 'Log In' : 'Create Account')) + '</button>' +
      '</form>' +
      forgotLink +
    '</div></div>'
  );
}

function renderForgotForm() {
  if (state.forgotSent) {
    return (
      '<div class="login-wrap"><div class="login-box" style="text-align:center;">' +
        '<div class="logo" style="margin-bottom:10px;">WorkMatch</div>' +
        '<div style="font-size:40px;">&#9993;&#65039;</div>' +
        '<h3 style="margin:10px 0;">Check your email</h3>' +
        '<p style="font-size:13px;color:#64748b;margin-bottom:16px;">If that email is registered, a reset link is on its way. It expires in 60 minutes.</p>' +
        '<button class="btn-primary btn-secondary" id="backToLoginBtn">Back to Log In</button>' +
      '</div></div>'
    );
  }
  var errorHtml = state.authError ? ('<div class="error-text">' + esc(state.authError) + '</div>') : '';
  return (
    '<div class="login-wrap"><div class="login-box">' +
      '<div style="text-align:center;margin-bottom:20px;">' +
        '<div class="logo">WorkMatch</div>' +
        '<p style="font-size:13px;color:#64748b;margin-top:6px;">Enter your email and we will send a reset link.</p>' +
      '</div>' +
      '<form id="forgotForm">' +
        '<input type="email" id="forgotEmail" placeholder="Email" value="' + esc(state.formValues.forgotEmail) + '" required />' +
        errorHtml +
        '<button type="submit" class="btn-primary" ' + (state.authLoading ? 'disabled' : '') + '>' + (state.authLoading ? 'Sending...' : 'Send Reset Link') + '</button>' +
      '</form>' +
      '<p style="text-align:center;margin-top:10px;"><button type="button" id="backToLoginBtn2" style="background:none;border:none;color:#2563eb;font-size:12px;cursor:pointer;text-decoration:underline;">Back to Log In</button></p>' +
    '</div></div>'
  );
}

function renderResetForm() {
  if (state.resetDone) {
    return (
      '<div class="login-wrap"><div class="login-box" style="text-align:center;">' +
        '<div class="logo" style="margin-bottom:10px;">WorkMatch</div>' +
        '<div style="font-size:40px;">&#9989;</div>' +
        '<h3 style="margin:10px 0;">Password updated</h3>' +
        '<p style="font-size:13px;color:#64748b;margin-bottom:16px;">You can now log in with your new password.</p>' +
        '<button class="btn-primary btn-secondary" id="backToLoginBtn3">Go to Log In</button>' +
      '</div></div>'
    );
  }
  var errorHtml = state.authError ? ('<div class="error-text">' + esc(state.authError) + '</div>') : '';
  return (
    '<div class="login-wrap"><div class="login-box">' +
      '<div style="text-align:center;margin-bottom:20px;">' +
        '<div class="logo">WorkMatch</div>' +
        '<p style="font-size:13px;color:#64748b;margin-top:6px;">Choose a new password.</p>' +
      '</div>' +
      '<form id="resetForm">' +
        '<input type="password" id="newPassword" placeholder="New password (min 8 characters)" minlength="8" required />' +
        '<input type="password" id="confirmPassword" placeholder="Confirm new password" minlength="8" required />' +
        errorHtml +
        '<button type="submit" class="btn-primary" ' + (state.authLoading ? 'disabled' : '') + '>' + (state.authLoading ? 'Updating...' : 'Set New Password') + '</button>' +
      '</form>' +
    '</div></div>'
  );
}

function attachLoginHandlers() {
  if (state.authMode === 'forgot') { attachForgotHandlers(); return; }
  if (state.authMode === 'reset') { attachResetHandlers(); return; }
  document.getElementById('modeLogin').onclick = function() { state.authMode = 'login'; state.authError = null; render(); };
  document.getElementById('modeRegister').onclick = function() { state.authMode = 'register'; state.authError = null; render(); };
  var forgotLink = document.getElementById('forgotLink');
  if (forgotLink) forgotLink.onclick = function() { state.authMode = 'forgot'; state.authError = null; state.forgotSent = false; render(); };
  document.getElementById('authForm').onsubmit = function(e) {
    e.preventDefault();
    captureAuthFieldValues();
    state.authError = null;
    state.authLoading = true;
    render();
    doAuth();
  };
}

function captureAuthFieldValues() {
  var emailEl = document.getElementById('loginEmail');
  if (emailEl) state.formValues.email = emailEl.value;
  var fn = document.getElementById('regFirstName');
  if (fn) state.formValues.firstName = fn.value;
  var ln = document.getElementById('regLastName');
  if (ln) state.formValues.lastName = ln.value;
  var ph = document.getElementById('regPhone');
  if (ph) state.formValues.phone = ph.value;
  var st = document.getElementById('regState');
  if (st) state.formValues.state = st.value;
}

function attachForgotHandlers() {
  var backBtn = document.getElementById('backToLoginBtn');
  if (backBtn) backBtn.onclick = function() { state.authMode = 'login'; state.forgotSent = false; render(); };

  var backBtn2 = document.getElementById('backToLoginBtn2');
  if (backBtn2) backBtn2.onclick = function() { state.authMode = 'login'; state.authError = null; render(); };

  var form = document.getElementById('forgotForm');
  if (form) form.onsubmit = function(e) {
    e.preventDefault();
    var emailEl = document.getElementById('forgotEmail');
    if (emailEl) state.formValues.forgotEmail = emailEl.value;
    state.authError = null;
    state.authLoading = true;
    render();
    var email = state.formValues.forgotEmail;
    fetch(API_BASE + '/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    })
      .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
      .then(function(result) {
        if (!result.ok) throw new Error(formatApiError(result.data.detail, 'Something went wrong'));
        state.forgotSent = true;
      })
      .catch(function(err) { state.authError = err.message || 'Something went wrong'; })
      .then(function() { state.authLoading = false; render(); });
  };
}

function attachResetHandlers() {
  var backBtn3 = document.getElementById('backToLoginBtn3');
  if (backBtn3) backBtn3.onclick = function() {
    state.authMode = 'login';
    state.resetDone = false;
    state.resetToken = null;
    window.history.replaceState({}, document.title, window.location.pathname);
    render();
  };

  var form = document.getElementById('resetForm');
  if (form) form.onsubmit = function(e) {
    e.preventDefault();
    state.authError = null;
    var newPw = document.getElementById('newPassword').value;
    var confirmPw = document.getElementById('confirmPassword').value;
    if (newPw !== confirmPw) {
      state.authError = 'Passwords do not match.';
      render();
      return;
    }
    state.authLoading = true;
    render();
    fetch(API_BASE + '/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: state.resetToken, new_password: newPw })
    })
      .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
      .then(function(result) {
        if (!result.ok) throw new Error(formatApiError(result.data.detail, 'Something went wrong'));
        state.resetDone = true;
      })
      .catch(function(err) { state.authError = err.message || 'Something went wrong'; })
      .then(function() { state.authLoading = false; render(); });
  };
}

function doAuth() {
  if (state.authMode === 'login') {
    var body = new URLSearchParams();
    body.append('username', document.getElementById('loginEmail').value);
    body.append('password', document.getElementById('loginPassword').value);
    fetch(API_BASE + '/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body })
      .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
      .then(function(result) {
        if (!result.ok) throw new Error(formatApiError(result.data.detail, 'Login failed'));
        if (result.data.user_type !== 'client') throw new Error("This login isn't a client account.");
        state.token = result.data.access_token;
        state.clientName = result.data.name;
        localStorage.setItem('pgusa_client_token', result.data.access_token);
        localStorage.setItem('pgusa_client_name', result.data.name);
        loadWorkers();
      })
      .catch(function(err) {
        state.authError = err.message || 'Something went wrong';
        state.authLoading = false;
        render();
      });
  } else {
    var payload = {
      first_name: document.getElementById('regFirstName').value,
      last_name: document.getElementById('regLastName').value,
      email: document.getElementById('loginEmail').value,
      phone: document.getElementById('regPhone').value,
      password: document.getElementById('loginPassword').value,
      state: document.getElementById('regState').value.toUpperCase()
    };
    fetch(API_BASE + '/auth/register/client', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
      .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
      .then(function(result) {
        if (!result.ok) throw new Error(formatApiError(result.data.detail, 'Registration failed'));
        state.token = result.data.access_token;
        state.clientName = result.data.name;
        localStorage.setItem('pgusa_client_token', result.data.access_token);
        localStorage.setItem('pgusa_client_name', result.data.name);
        loadWorkers();
      })
      .catch(function(err) {
        state.authError = err.message || 'Something went wrong';
        state.authLoading = false;
        render();
      });
  }
}

function loadWorkers() {
  state.loading = true;
  state.error = null;
  render();
  fetch(API_BASE + '/workers/browse?limit=50')
    .then(function(res) {
      if (!res.ok) throw new Error('Server returned ' + res.status);
      return res.json();
    })
    .then(function(data) { state.workers = data.workers || []; })
    .catch(function(err) { state.error = 'Could not load workers. Try again shortly.'; })
    .then(function() {
      state.loading = false;
      state.authLoading = false;
      render();
    });
}

function renderApp() {
  var tabsHtml =
    '<div class="tabs">' +
      '<button class="tab ' + (state.activeTab==='discover'?'active':'') + '" data-tab="discover">Discover</button>' +
      '<button class="tab ' + (state.activeTab==='matches'?'active':'') + '" data-tab="matches">Booked</button>' +
    '</div>';
  return (
    '<div class="app-header"><div class="logo">WorkMatch</div>' +
      '<div style="display:flex;align-items:center;gap:12px;">' +
        '<span style="font-size:13px;color:#64748b;">Hi, ' + esc(state.clientName) + '</span>' +
        '<button class="logout-link" id="logoutBtn">Log out</button>' +
      '</div>' +
    '</div>' +
    tabsHtml +
    '<div class="container">' + (state.activeTab === 'discover' ? renderDiscover() : renderMatches()) + '</div>' +
    (state.bookingWorker ? renderBookingModal() : '')
  );
}

function renderDiscover() {
  if (state.loading) return '<div class="empty-state">Loading approved workers...</div>';
  if (state.error) return '<div class="empty-state"><p style="color:#dc2626;font-weight:700;">' + esc(state.error) + '</p><button class="btn-primary" id="retryBtn" style="max-width:200px;margin:12px auto;">Retry</button></div>';

  var w = state.workers[state.cardIndex];
  if (!w) {
    if (state.workers.length === 0) return '<div class="empty-state"><h3>No approved workers yet</h3><p>Check back soon.</p></div>';
    return '<div class="empty-state"><h3>You have reviewed everyone!</h3><button class="btn-primary" id="resetBtn" style="max-width:200px;margin:12px auto;">Start Over</button></div>';
  }

  var skills = (w.skills || []).map(function(s) { return '<span class="skill">&check; ' + esc(s) + '</span>'; }).join('');
  return (
    '<div class="card">' +
      '<div class="card-banner"><div class="avatar">' + avatarFor(w.id) + '</div></div>' +
      '<div class="card-body">' +
        '<div class="worker-name">' + esc(w.name) + '</div>' +
        '<div class="worker-title">' + esc(w.title) + '</div>' +
        '<div class="stat-row">' +
          '<div><div class="stat-num" style="color:#2563eb;">' + w.jobs + '</div><div class="stat-label">Jobs</div></div>' +
          '<div><div class="stat-num" style="color:#d97706;">' + (w.rating||0).toFixed(1) + '&#9733;</div><div class="stat-label">Rating</div></div>' +
          '<div><div class="stat-num" style="color:#059669;">' + (w.experience_years != null ? w.experience_years + 'y' : '&mdash;') + '</div><div class="stat-label">Experience</div></div>' +
        '</div>' +
        '<div class="loc-row">&#128205; ' + esc(w.location) + '</div>' +
        '<div>' + skills + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="btn-row">' +
      '<button class="btn btn-skip" id="skipBtn">Skip</button>' +
      '<button class="btn btn-book" id="bookBtn">Book This Worker</button>' +
    '</div>' +
    '<div style="text-align:center;font-size:12px;color:#64748b;margin-top:12px;">' + (state.cardIndex+1) + ' of ' + state.workers.length + '</div>'
  );
}

function renderMatches() {
  var matched = state.workers.filter(function(w) { return state.matches.indexOf(w.id) !== -1; });
  if (matched.length === 0) return '<div class="empty-state"><h3>No confirmed bookings yet.</h3></div>';
  return matched.map(function(w) {
    return '<div class="card" style="margin-bottom:12px;"><div style="padding:16px;display:flex;gap:12px;align-items:center;"><div style="font-size:36px;">' + avatarFor(w.id) + '</div><div><div style="font-weight:800;">' + esc(w.name) + '</div><div style="color:#059669;font-size:13px;font-weight:700;">' + esc(w.title) + '</div></div></div></div>';
  }).join('');
}

function renderBookingModal() {
  var w = state.bookingWorker;
  if (state.bookingResult) {
    var r = state.bookingResult;
    var payLink = r.stripe_link ? ('<a href="' + esc(r.stripe_link) + '" target="_blank" class="btn-primary" style="display:block;text-decoration:none;margin-bottom:10px;">Pay Now</a>') : '';
    return (
      '<div class="modal-overlay"><div class="modal-box" style="text-align:center;">' +
        '<div style="font-size:48px;">&#9989;</div>' +
        '<h3 style="margin:10px 0;">Booking Confirmed</h3>' +
        '<p style="font-size:13px;color:#64748b;margin-bottom:14px;">' + esc(r.message) + '</p>' +
        '<div style="background:#f8fafc;border-radius:10px;padding:14px;text-align:left;font-size:13px;margin-bottom:14px;">' +
          '<div class="result-line"><strong>Service:</strong> ' + esc(r.service) + '</div>' +
          '<div class="result-line"><strong>Client Price:</strong> $' + esc(r.price) + '</div>' +
          '<div class="result-line"><strong>Worker Pay:</strong> $' + esc(r.worker_pay) + '</div>' +
          '<div class="result-line"><strong>Platform Fee:</strong> $' + esc(r.platform_fee) + '</div>' +
          '<div class="result-line"><strong>Date:</strong> ' + esc(r.date) + ' at ' + esc(r.time) + '</div>' +
          '<div class="result-line"><strong>Status:</strong> ' + esc(r.status) + '</div>' +
          '<div class="result-line"><strong>Booking ID:</strong> ' + esc(r.booking_id) + '</div>' +
        '</div>' +
        payLink +
        '<button class="btn-primary btn-secondary" id="closeModalBtn">Done</button>' +
      '</div></div>'
    );
  }

  var options = state.pricingOptions.map(function(o) {
    return '<option value="' + esc(o.service_type) + '">' + esc(o.title) + (o.price ? ' &mdash; $' + esc(o.price) : '') + '</option>';
  }).join('');
  var serviceField = state.pricingLoading
    ? '<p style="font-size:13px;color:#64748b;">Loading services...</p>'
    : ('<select id="serviceType" required><option value="">Select a service</option>' + options + '</select>');
  var errorHtml = state.bookingError ? ('<div class="error-text">' + esc(state.bookingError) + '</div>') : '';

  return (
    '<div class="modal-overlay"><div class="modal-box">' +
      '<h3 style="margin-bottom:14px;">Book ' + esc(w.name) + '</h3>' +
      '<form id="bookingForm">' +
        serviceField +
        '<div class="two-col">' +
          '<input type="date" id="schedDate" required />' +
          '<input type="time" id="schedTime" required />' +
        '</div>' +
        '<input type="text" id="stateInput" placeholder="State (e.g. TX)" maxlength="2" required />' +
        '<input type="text" id="locationInput" placeholder="Location (optional)" />' +
        '<label class="checkbox"><input type="checkbox" id="isRemote" /> Remote/online job</label>' +
        '<textarea id="notesInput" placeholder="Notes (optional)" rows="2"></textarea>' +
        errorHtml +
        '<div class="two-col">' +
          '<button type="button" class="btn btn-skip" id="cancelBookingBtn">Cancel</button>' +
          '<button type="submit" class="btn btn-book" ' + (state.bookingSubmitting ? 'disabled' : '') + '>' + (state.bookingSubmitting ? 'Booking...' : 'Confirm & Book') + '</button>' +
        '</div>' +
      '</form>' +
    '</div></div>'
  );
}

function attachAppHandlers() {
  document.getElementById('logoutBtn').onclick = function() {
    state.token = null; state.clientName = null;
    localStorage.removeItem('pgusa_client_token');
    localStorage.removeItem('pgusa_client_name');
    render();
  };
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].onclick = function() { state.activeTab = this.getAttribute('data-tab'); render(); };
  }

  var retryBtn = document.getElementById('retryBtn');
  if (retryBtn) retryBtn.onclick = loadWorkers;

  var resetBtn = document.getElementById('resetBtn');
  if (resetBtn) resetBtn.onclick = function() { state.cardIndex = 0; render(); };

  var skipBtn = document.getElementById('skipBtn');
  if (skipBtn) skipBtn.onclick = function() { state.cardIndex++; render(); };

  var bookBtn = document.getElementById('bookBtn');
  if (bookBtn) bookBtn.onclick = function() { startBooking(state.workers[state.cardIndex]); };

  attachBookingHandlers();
}

function startBooking(worker) {
  state.bookingWorker = worker;
  state.bookingError = null;
  state.bookingResult = null;
  state.pricingLoading = true;
  render();
  fetch(API_BASE + '/jobs/pricing')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var options;
      if (Array.isArray(data)) {
        options = data;
      } else if (data.services) {
        options = data.services;
      } else {
        options = Object.keys(data).map(function(key) {
          var val = data[key];
          return { service_type: key, title: (val && val.title) || key, price: val && val.price };
        });
      }
      state.pricingOptions = options;
    })
    .catch(function(err) { state.bookingError = 'Could not load service pricing.'; })
    .then(function() { state.pricingLoading = false; render(); });
}

function attachBookingHandlers() {
  var closeBtn = document.getElementById('closeModalBtn');
  if (closeBtn) closeBtn.onclick = closeBookingModal;

  var cancelBtn = document.getElementById('cancelBookingBtn');
  if (cancelBtn) cancelBtn.onclick = closeBookingModal;

  var form = document.getElementById('bookingForm');
  if (form) form.onsubmit = function(e) {
    e.preventDefault();
    state.bookingError = null;
    state.bookingSubmitting = true;
    render();

    var payload = {
      service_type: document.getElementById('serviceType') ? document.getElementById('serviceType').value : '',
      scheduled_date: document.getElementById('schedDate').value,
      scheduled_time: document.getElementById('schedTime').value,
      state: document.getElementById('stateInput').value.toUpperCase(),
      location: document.getElementById('locationInput').value,
      is_remote: document.getElementById('isRemote').checked,
      notes: document.getElementById('notesInput').value,
      worker_id: state.bookingWorker.id
    };
    if (!payload.service_type || !payload.scheduled_date || !payload.scheduled_time || !payload.state) {
      state.bookingError = 'Please fill in service, date, time, and state.';
      state.bookingSubmitting = false;
      render();
      return;
    }

    fetch(API_BASE + '/bookings/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.token },
      body: JSON.stringify(payload)
    })
      .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
      .then(function(result) {
        if (!result.ok) throw new Error(formatApiError(result.data.detail, 'Booking failed'));
        state.bookingResult = result.data;
        if (state.matches.indexOf(state.bookingWorker.id) === -1) state.matches.push(state.bookingWorker.id);
      })
      .catch(function(err) { state.bookingError = err.message || 'Booking failed'; })
      .then(function() { state.bookingSubmitting = false; render(); });
  };
}

function closeBookingModal() {
  state.bookingWorker = null;
  state.bookingError = null;
  state.bookingResult = null;
  render();
}

if (state.token) { loadWorkers(); } else { render(); }
</script>
</body>
</html>
