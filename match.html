<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WorkMatch — Find & Book PGUSA Workers</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const API_BASE = 'https://pgusa-platform-production.up.railway.app';

const AVATAR_EMOJIS = ['🧑‍💼', '👩‍💼', '👨‍💼', '👩‍💻', '👨‍⚖️', '👩‍🔧', '👨‍🔧'];
function avatarFor(id) {
  let hash = 0;
  const s = String(id);
  for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
  return AVATAR_EMOJIS[hash % AVATAR_EMOJIS.length];
}

function WorkerMatchmaking() {
  const [activeTab, setActiveTab] = useState('discover');
  const [cardIndex, setCardIndex] = useState(0);
  const [matches, setMatches] = useState([]);

  const [workers, setWorkers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const [token, setToken] = useState(() => localStorage.getItem('pgusa_client_token') || null);
  const [clientName, setClientName] = useState(() => localStorage.getItem('pgusa_client_name') || null);

  // Login vs Register toggle
  const [authMode, setAuthMode] = useState('login'); // 'login' | 'register'
  const [loginEmail, setLoginEmail] = useState('');
  const [loginPassword, setLoginPassword] = useState('');
  const [regFirstName, setRegFirstName] = useState('');
  const [regLastName, setRegLastName] = useState('');
  const [regPhone, setRegPhone] = useState('');
  const [regState, setRegState] = useState('');
  const [authError, setAuthError] = useState(null);
  const [authLoading, setAuthLoading] = useState(false);

  const [bookingWorker, setBookingWorker] = useState(null);
  const [pricingOptions, setPricingOptions] = useState([]);
  const [pricingLoading, setPricingLoading] = useState(false);
  const [bookingForm, setBookingForm] = useState({
    service_type: '', scheduled_date: '', scheduled_time: '',
    state: '', location: '', is_remote: false, notes: '',
  });
  const [bookingSubmitting, setBookingSubmitting] = useState(false);
  const [bookingError, setBookingError] = useState(null);
  const [bookingResult, setBookingResult] = useState(null);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      setLoading(true);
      setError(null);
      try {
        const res = await fetch(API_BASE + '/workers/browse?limit=50');
        if (!res.ok) throw new Error('Server returned ' + res.status);
        const data = await res.json();
        if (!cancelled) setWorkers(data.workers || []);
      } catch (err) {
        if (!cancelled) setError('Could not load workers. Try again shortly.');
      } finally {
        if (!cancelled) setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  const currentWorker = cardIndex < workers.length ? workers[cardIndex] : null;
  const matchedProfiles = workers.filter(w => matches.includes(w.id));

  function handleSkip() { setCardIndex(cardIndex + 1); }

  async function handleLogin(e) {
    e.preventDefault();
    setAuthError(null);
    setAuthLoading(true);
    try {
      const body = new URLSearchParams();
      body.append('username', loginEmail);
      body.append('password', loginPassword);
      const res = await fetch(API_BASE + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Login failed');
      if (data.user_type !== 'client') throw new Error("This login isn't a client account.");
      setToken(data.access_token);
      setClientName(data.name);
      localStorage.setItem('pgusa_client_token', data.access_token);
      localStorage.setItem('pgusa_client_name', data.name);
    } catch (err) {
      setAuthError(err.message || 'Login failed');
    } finally {
      setAuthLoading(false);
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    setAuthError(null);
    setAuthLoading(true);
    try {
      const res = await fetch(API_BASE + '/auth/register/client', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          first_name: regFirstName,
          last_name: regLastName,
          email: loginEmail,
          phone: regPhone,
          password: loginPassword,
          state: regState.toUpperCase(),
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Registration failed');
      setToken(data.access_token);
      setClientName(data.name);
      localStorage.setItem('pgusa_client_token', data.access_token);
      localStorage.setItem('pgusa_client_name', data.name);
    } catch (err) {
      setAuthError(err.message || 'Registration failed');
    } finally {
      setAuthLoading(false);
    }
  }

  function handleLogout() {
    setToken(null);
    setClientName(null);
    localStorage.removeItem('pgusa_client_token');
    localStorage.removeItem('pgusa_client_name');
  }

  async function startBooking(worker) {
    setBookingWorker(worker);
    setBookingError(null);
    setBookingResult(null);
    setPricingLoading(true);
    try {
      const res = await fetch(API_BASE + '/jobs/pricing');
      const data = await res.json();
      let options;
      if (Array.isArray(data)) options = data;
      else if (data.services) options = data.services;
      else options = Object.entries(data).map(([key, val]) => ({
        service_type: key, title: (val && val.title) || key, price: val && val.price,
      }));
      setPricingOptions(options);
      if (options.length > 0) setBookingForm(f => ({ ...f, service_type: options[0].service_type }));
    } catch (err) {
      setBookingError('Could not load service pricing.');
    } finally {
      setPricingLoading(false);
    }
  }

  function closeBookingModal() {
    setBookingWorker(null);
    setBookingError(null);
    setBookingResult(null);
    setBookingForm({ service_type: '', scheduled_date: '', scheduled_time: '', state: '', location: '', is_remote: false, notes: '' });
  }

  async function submitBooking(e) {
    e.preventDefault();
    setBookingError(null);
    setBookingSubmitting(true);
    try {
      if (!bookingForm.service_type || !bookingForm.scheduled_date || !bookingForm.scheduled_time || !bookingForm.state) {
        throw new Error('Please fill in service, date, time, and state.');
      }
      const res = await fetch(API_BASE + '/bookings/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ ...bookingForm, worker_id: bookingWorker.id }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Booking failed');
      setBookingResult(data);
      setMatches(m => m.includes(bookingWorker.id) ? m : [...m, bookingWorker.id]);
    } catch (err) {
      setBookingError(err.message || 'Booking failed');
    } finally {
      setBookingSubmitting(false);
    }
  }

  if (!token) {
    return (
      <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 flex items-center justify-center p-4">
        <div className="bg-white rounded-2xl shadow-lg p-8 max-w-sm w-full">
          <div className="text-center mb-6">
            <div className="text-2xl font-bold bg-gradient-to-r from-blue-600 to-emerald-600 bg-clip-text text-transparent mb-2">WorkMatch</div>
            <p className="text-slate-600 text-sm">
              {authMode === 'login' ? 'Log in to book real workers.' : 'Create a client account to get started.'}
            </p>
          </div>

          <div className="flex gap-2 mb-4">
            <button onClick={() => setAuthMode('login')} className={`flex-1 py-2 rounded-lg text-sm font-semibold ${authMode === 'login' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'}`}>Log In</button>
            <button onClick={() => setAuthMode('register')} className={`flex-1 py-2 rounded-lg text-sm font-semibold ${authMode === 'register' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'}`}>Register</button>
          </div>

          <form onSubmit={authMode === 'login' ? handleLogin : handleRegister} className="space-y-3">
            {authMode === 'register' && (
              <>
                <div className="grid grid-cols-2 gap-2">
                  <input type="text" placeholder="First name" value={regFirstName} onChange={e => setRegFirstName(e.target.value)} className="px-3 py-2 border border-slate-300 rounded-lg text-sm" required />
                  <input type="text" placeholder="Last name" value={regLastName} onChange={e => setRegLastName(e.target.value)} className="px-3 py-2 border border-slate-300 rounded-lg text-sm" required />
                </div>
                <input type="tel" placeholder="Phone" value={regPhone} onChange={e => setRegPhone(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" required />
                <input type="text" placeholder="State (e.g. TX)" maxLength={2} value={regState} onChange={e => setRegState(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" required />
              </>
            )}
            <input type="email" placeholder="Email" value={loginEmail} onChange={e => setLoginEmail(e.target.value)} className="w-full px-4 py-3 border border-slate-300 rounded-xl text-sm" required />
            <input type="password" placeholder="Password" value={loginPassword} onChange={e => setLoginPassword(e.target.value)} className="w-full px-4 py-3 border border-slate-300 rounded-xl text-sm" required />
            {authError && <p className="text-red-600 text-xs">{authError}</p>}
            <button type="submit" disabled={authLoading} className="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold rounded-xl disabled:opacity-60">
              {authLoading ? 'Please wait...' : (authMode === 'login' ? 'Log In' : 'Create Account')}
            </button>
          </form>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 text-slate-900">
      <div className="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-slate-200">
        <div className="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between">
          <div className="text-2xl font-bold bg-gradient-to-r from-blue-600 to-emerald-600 bg-clip-text text-transparent">WorkMatch</div>
          <div className="flex items-center gap-3">
            <span className="text-sm text-slate-600 hidden sm:inline">Hi, {clientName}</span>
            <button onClick={handleLogout} className="text-xs text-slate-500 underline">Log out</button>
          </div>
        </div>
      </div>

      <div className="sticky top-16 z-10 bg-white/95 backdrop-blur border-b border-slate-200">
        <div className="max-w-2xl mx-auto px-4 flex gap-6">
          {['discover', 'matches'].map(tab => (
            <button key={tab} onClick={() => setActiveTab(tab)}
              className={`py-3 px-2 font-semibold text-sm uppercase tracking-wide transition border-b-2 ${activeTab === tab ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-600'}`}>
              {tab === 'discover' ? '🎯 Discover' : '❤️ Booked'}
            </button>
          ))}
        </div>
      </div>

      <div className="max-w-2xl mx-auto">
        {activeTab === 'discover' && (
          <div className="p-4 pb-20">
            {loading ? (
              <div className="text-center py-24 text-slate-500">Loading approved workers...</div>
            ) : error ? (
              <div className="text-center py-20">
                <p className="text-red-600 font-semibold mb-2">{error}</p>
                <button onClick={() => window.location.reload()} className="px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg">Retry</button>
              </div>
            ) : currentWorker ? (
              <div className="space-y-4">
                <div className="bg-white rounded-2xl overflow-hidden shadow-lg">
                  <div className="h-32 bg-gradient-to-r from-blue-500 via-emerald-500 to-teal-500 relative">
                    <div className="absolute bottom-0 left-0 right-0 flex justify-center">
                      <div className="w-28 h-28 rounded-full bg-gradient-to-br from-slate-100 to-slate-200 border-4 border-white flex items-center justify-center text-6xl shadow-md">
                        {avatarFor(currentWorker.id)}
                      </div>
                    </div>
                  </div>
                  <div className="pt-16 px-6 pb-6 space-y-4">
                    <div className="text-center">
                      <h2 className="text-2xl font-bold">{currentWorker.name}</h2>
                      <p className="text-emerald-600 font-semibold">{currentWorker.title}</p>
                    </div>
                    <div className="grid grid-cols-3 gap-4 py-4 border-y border-slate-200">
                      <div className="text-center"><div className="text-2xl font-bold text-blue-600">{currentWorker.jobs}</div><div className="text-xs text-slate-600">Jobs</div></div>
                      <div className="text-center"><div className="text-2xl font-bold text-amber-600">{currentWorker.rating.toFixed(1)}⭐</div><div className="text-xs text-slate-600">Rating</div></div>
                      <div className="text-center"><div className="text-2xl font-bold text-emerald-600">{currentWorker.experience_years != null ? currentWorker.experience_years + 'y' : '—'}</div><div className="text-xs text-slate-600">Experience</div></div>
                    </div>
                    <p className="text-sm text-slate-700">📍 {currentWorker.location}</p>
                    <div className="flex flex-wrap gap-2">
                      {currentWorker.skills.map((skill, i) => (
                        <span key={i} className="px-3 py-1 bg-gradient-to-r from-blue-100 to-emerald-100 text-blue-700 text-xs font-semibold rounded-full">✓ {skill}</span>
                      ))}
                    </div>
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <button onClick={handleSkip} className="py-4 px-6 bg-slate-100 text-slate-700 font-bold rounded-xl">Skip</button>
                  <button onClick={() => startBooking(currentWorker)} className="py-4 px-6 bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold rounded-xl">Book This Worker</button>
                </div>
                <div className="text-center text-xs text-slate-500 mt-4">{cardIndex + 1} of {workers.length}</div>
              </div>
            ) : (
              <div className="text-center py-20">
                <h3 className="text-xl font-bold mb-2">You've reviewed everyone!</h3>
                <button onClick={() => setCardIndex(0)} className="px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg">Start Over</button>
              </div>
            )}
          </div>
        )}

        {activeTab === 'matches' && (
          <div className="p-4 pb-20">
            <h2 className="text-2xl font-bold mb-6">Booked Workers</h2>
            {matchedProfiles.length === 0 ? (
              <p className="text-slate-600 text-center py-12">No confirmed bookings yet.</p>
            ) : (
              <div className="grid gap-4">
                {matchedProfiles.map(worker => (
                  <div key={worker.id} className="bg-white rounded-lg p-4 border border-slate-200">
                    <h3 className="font-bold text-lg">{worker.name}</h3>
                    <p className="text-emerald-600 text-sm font-semibold">{worker.title}</p>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>

      {bookingWorker && (
        <div className="fixed inset-0 bg-black/50 flex items-end sm:items-center justify-center z-30 p-4">
          <div className="bg-white rounded-2xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
            {bookingResult ? (
              <div className="text-center py-4">
                <div className="text-5xl mb-3">✅</div>
                <h3 className="text-xl font-bold mb-2">Booking Confirmed</h3>
                <p className="text-sm text-slate-600 mb-4">{bookingResult.message}</p>
                <div className="bg-slate-50 rounded-lg p-4 text-left text-sm space-y-1 mb-4">
                  <p><strong>Service:</strong> {bookingResult.service}</p>
                  <p><strong>Client Price:</strong> ${bookingResult.price}</p>
                  <p><strong>Worker Pay:</strong> ${bookingResult.worker_pay}</p>
                  <p><strong>Platform Fee:</strong> ${bookingResult.platform_fee}</p>
                  <p><strong>Date:</strong> {bookingResult.date} at {bookingResult.time}</p>
                  <p><strong>Status:</strong> {bookingResult.status}</p>
                  <p><strong>Booking ID:</strong> {bookingResult.booking_id}</p>
                </div>
                {bookingResult.stripe_link && (
                  <a href={bookingResult.stripe_link} target="_blank" rel="noopener noreferrer" className="block w-full py-3 bg-blue-600 text-white font-bold rounded-xl mb-3">Pay Now</a>
                )}
                <button onClick={closeBookingModal} className="w-full py-3 bg-slate-100 text-slate-700 font-bold rounded-xl">Done</button>
              </div>
            ) : (
              <form onSubmit={submitBooking} className="space-y-4">
                <h3 className="text-lg font-bold">Book {bookingWorker.name}</h3>
                {pricingLoading ? (
                  <p className="text-sm text-slate-500">Loading services...</p>
                ) : (
                  <select value={bookingForm.service_type} onChange={e => setBookingForm(f => ({ ...f, service_type: e.target.value }))} className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" required>
                    <option value="">Select a service</option>
                    {pricingOptions.map(opt => (
                      <option key={opt.service_type} value={opt.service_type}>{opt.title}{opt.price ? ' — $' + opt.price : ''}</option>
                    ))}
                  </select>
                )}
                <div className="grid grid-cols-2 gap-3">
                  <input type="date" value={bookingForm.scheduled_date} onChange={e => setBookingForm(f => ({ ...f, scheduled_date: e.target.value }))} className="px-3 py-2 border border-slate-300 rounded-lg text-sm" required />
                  <input type="time" value={bookingForm.scheduled_time} onChange={e => setBookingForm(f => ({ ...f, scheduled_time: e.target.value }))} className="px-3 py-2 border border-slate-300 rounded-lg text-sm" required />
                </div>
                <input type="text" placeholder="State (e.g. TX)" maxLength={2} value={bookingForm.state} onChange={e => setBookingForm(f => ({ ...f, state: e.target.value.toUpperCase() }))} className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" required />
                <input type="text" placeholder="Location (optional)" value={bookingForm.location} onChange={e => setBookingForm(f => ({ ...f, location: e.target.value }))} className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" />
                <label className="flex items-center gap-2 text-sm text-slate-600">
                  <input type="checkbox" checked={bookingForm.is_remote} onChange={e => setBookingForm(f => ({ ...f, is_remote: e.target.checked }))} />
                  Remote/online job
                </label>
                <textarea placeholder="Notes (optional)" value={bookingForm.notes} onChange={e => setBookingForm(f => ({ ...f, notes: e.target.value }))} className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" rows={2} />
                {bookingError && <p className="text-red-600 text-xs">{bookingError}</p>}
                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button type="button" onClick={closeBookingModal} className="py-3 bg-slate-100 text-slate-700 font-bold rounded-xl">Cancel</button>
                  <button type="submit" disabled={bookingSubmitting} className="py-3 bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold rounded-xl disabled:opacity-60">
                    {bookingSubmitting ? 'Booking...' : 'Confirm & Book'}
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<WorkerMatchmaking />);
</script>
</body>
</html>
